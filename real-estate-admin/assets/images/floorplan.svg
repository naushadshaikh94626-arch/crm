<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background-color: #f8fafc; font-family: Inter, sans-serif;">
  <!-- Floor Background -->
  <rect x="10" y="10" width="580" height="380" fill="#f1f5f9" stroke="#94a3b8" stroke-width="4" rx="8" />
  
  <!-- Outer Walls -->
  <rect x="20" y="20" width="560" height="360" fill="#ffffff" stroke="#334155" stroke-width="5" />
  
  <!-- Conference Room -->
  <rect x="20" y="20" width="220" height="150" fill="#f8fafc" stroke="#64748b" stroke-width="3" />
  <text x="75" y="45" font-size="12" font-weight="600" fill="#475569">CONFERENCE ROOM</text>
  <rect x="65" y="65" width="130" height="60" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <!-- Conference Chairs -->
  <circle cx="85" cy="53" r="7" fill="#64748b" />
  <circle cx="115" cy="53" r="7" fill="#64748b" />
  <circle cx="145" cy="53" r="7" fill="#64748b" />
  <circle cx="175" cy="53" r="7" fill="#64748b" />
  <circle cx="85" cy="137" r="7" fill="#64748b" />
  <circle cx="115" cy="137" r="7" fill="#64748b" />
  <circle cx="145" cy="137" r="7" fill="#64748b" />
  <circle cx="175" cy="137" r="7" fill="#64748b" />
  <circle cx="53" cy="95" r="7" fill="#64748b" />
  <circle cx="207" cy="95" r="7" fill="#64748b" />
  
  <!-- Executive Cabin -->
  <rect x="240" y="20" width="170" height="150" fill="#f8fafc" stroke="#64748b" stroke-width="3" />
  <text x="275" y="45" font-size="12" font-weight="600" fill="#475569">EXECUTIVE CABIN</text>
  <rect x="275" y="65" width="100" height="50" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="2" />
  <circle cx="325" cy="53" r="8" fill="#ea580c" />
  <circle cx="300" cy="127" r="6" fill="#94a3b8" />
  <circle cx="350" cy="127" r="6" fill="#94a3b8" />
  
  <!-- Server / Pantry -->
  <rect x="410" y="20" width="170" height="150" fill="#f8fafc" stroke="#64748b" stroke-width="3" />
  <text x="460" y="45" font-size="12" font-weight="600" fill="#475569">PANTRY / LOUNGE</text>
  <rect x="435" y="70" width="120" height="40" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="4" />
  <circle cx="455" cy="125" r="8" fill="#38bdf8" />
  <circle cx="495" cy="125" r="8" fill="#38bdf8" />
  <circle cx="535" cy="125" r="8" fill="#38bdf8" />

  <!-- Open Workstation Bay -->
  <rect x="60" y="210" width="480" height="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,4" rx="6" />
  <text x="230" y="232" font-size="13" font-weight="700" fill="#f4510b">OPEN WORKSTATIONS (24 SEATER)</text>

  <!-- Workstation cluster 1 -->
  <g transform="translate(90, 245)">
    <rect x="0" y="0" width="160" height="85" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" rx="4"/>
    <line x1="80" y1="0" x2="80" y2="85" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="0" y1="42.5" x2="160" y2="42.5" stroke="#f4510b" stroke-width="2" />
    <!-- Screens & Chairs -->
    <rect x="25" y="32" width="30" height="4" fill="#334155" />
    <rect x="105" y="32" width="30" height="4" fill="#334155" />
    <rect x="25" y="49" width="30" height="4" fill="#334155" />
    <rect x="105" y="49" width="30" height="4" fill="#334155" />
    <circle cx="40" cy="12" r="7" fill="#64748b" />
    <circle cx="120" cy="12" r="7" fill="#64748b" />
    <circle cx="40" cy="73" r="7" fill="#64748b" />
    <circle cx="120" cy="73" r="7" fill="#64748b" />
  </g>

  <!-- Workstation cluster 2 -->
  <g transform="translate(350, 245)">
    <rect x="0" y="0" width="160" height="85" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" rx="4"/>
    <line x1="80" y1="0" x2="80" y2="85" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="0" y1="42.5" x2="160" y2="42.5" stroke="#f4510b" stroke-width="2" />
    <!-- Screens & Chairs -->
    <rect x="25" y="32" width="30" height="4" fill="#334155" />
    <rect x="105" y="32" width="30" height="4" fill="#334155" />
    <rect x="25" y="49" width="30" height="4" fill="#334155" />
    <rect x="105" y="49" width="30" height="4" fill="#334155" />
    <circle cx="40" cy="12" r="7" fill="#64748b" />
    <circle cx="120" cy="12" r="7" fill="#64748b" />
    <circle cx="40" cy="73" r="7" fill="#64748b" />
    <circle cx="120" cy="73" r="7" fill="#64748b" />
  </g>

  <!-- Doors & Entrances -->
  <path d="M 285 380 A 40 40 0 0 1 325 380" fill="none" stroke="#f4510b" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="285" y1="380" x2="285" y2="350" stroke="#f4510b" stroke-width="3" />
  <text x="275" y="394" font-size="10" font-weight="700" fill="#f4510b">MAIN ENTRANCE</text>

  <!-- Dimensions labels -->
  <text x="35" y="390" font-size="11" fill="#64748b">Area: 1,850 Sq.Ft | Carpet: 1,480 Sq.Ft</text>
  <text x="440" y="390" font-size="11" fill="#64748b">Scale: 1:100 (Dimensions in Ft)</text>
</svg>
